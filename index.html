<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Ozark Prosthodontics | Claims Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@2.38.3/lib/msal-browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f0f2f5;color:#1a1a2e;min-height:100vh}
nav{background:#1e3a5f;padding:0 1.5rem;display:flex;align-items:center;justify-content:space-between;height:56px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.brand{color:#c8a96e;font-weight:700;font-size:1.1rem}
.nav-right{display:flex;align-items:center;gap:1rem}
.nav-user{color:#cdd5df;font-size:.85rem}
.btn-out{background:transparent;border:1px solid #c8a96e;color:#c8a96e;border-radius:4px;padding:4px 12px;cursor:pointer;font-size:.8rem}
.btn-ref{background:#c8a96e;border:none;color:#1e3a5f;border-radius:4px;padding:4px 14px;cursor:pointer;font-size:.8rem;font-weight:700}
#login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f0f2f5}
.login-card{background:#fff;border-radius:12px;padding:3rem 2.5rem;box-shadow:0 4px 24px rgba(0,0,0,.1);text-align:center;max-width:400px;width:100%}
.login-card h1{color:#1e3a5f;margin-bottom:.25rem}
.login-card p{color:#666;margin-bottom:2rem;font-size:.95rem}
.btn-login{background:#1e3a5f;color:#fff;border:none;border-radius:8px;padding:.75rem 2rem;font-size:1rem;cursor:pointer;width:100%;font-weight:600}
.login-note{margin-top:1rem;font-size:.8rem;color:#999}
#app-screen{display:none}
main{padding:1.5rem;max-width:1400px;margin:0 auto}
.status-bar{border-radius:6px;padding:.5rem 1rem;margin-bottom:1.25rem;font-size:.85rem;display:flex;align-items:center;gap:.5rem}
.status-loading{background:#e8f4fd;border:1px solid #bee3f8;color:#2b6cb0}
.status-error{background:#fff5f5;border:1px solid #feb2b2;color:#c53030}
.status-ok{background:#f0fff4;border:1px solid #9ae6b4;color:#276749}
.spinner{width:14px;height:14px;border:2px solid #bee3f8;border-top-color:#2b6cb0;border-radius:50%;animation:spin .8s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
.kpi-row{display:flex;gap:1rem;flex-wrap:wrap;margin-bottom:1.5rem}
.kpi-card{background:#fff;border-radius:10px;padding:1.25rem 1.5rem;box-shadow:0 2px 8px rgba(0,0,0,.08);min-width:180px;flex:1}
.kpi-label{font-size:.75rem;color:#666;margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em}
.kpi-value{font-size:1.7rem;font-weight:700;color:#1e3a5f}
.kpi-value.danger{color:#c0392b}
.kpi-sub{font-size:.78rem;color:#999;margin-top:2px}
.chart-card{background:#fff;border-radius:10px;padding:1.25rem 1.5rem;box-shadow:0 2px 8px rgba(0,0,0,.08);margin-bottom:1.25rem}
.chart-card h3{color:#1e3a5f;margin-bottom:1rem;font-size:1rem}
.charts-grid{display:grid;grid-template-columns:1fr 1fr;gap:1.25rem}
.footer{text-align:center;color:#aaa;font-size:.78rem;padding:1.5rem 0}
@media(max-width:700px){.charts-grid{grid-template-columns:1fr}.kpi-card{min-width:140px}}
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-card">
    <div style="font-size:2.5rem;margin-bottom:.5rem">&#x1F9B7;</div>
    <h1>Ozark Prosthodontics</h1>
    <p>Claims Dashboard</p>
    <button class="btn-login" onclick="signIn()">Sign in with Microsoft</button>
    <p class="login-note">Use your @ozarkpros.com account</p>
  </div>
</div>

<div id="app-screen">
  <nav>
    <div class="brand">Ozark Prosthodontics | Claims Dashboard</div>
    <div class="nav-right">
      <span class="nav-user" id="nav-email"></span>
      <button class="btn-ref" onclick="loadData()">Refresh</button>
      <button class="btn-out" onclick="signOut()">Sign out</button>
    </div>
  </nav>
  <main>
    <div id="status-bar" style="display:none"></div>
    <div class="kpi-row">
      <div class="kpi-card"><div class="kpi-label">Total Outstanding</div><div class="kpi-value" id="kpi-total">--</div><div class="kpi-sub">All offices</div></div>
      <div class="kpi-card"><div class="kpi-label">Over 60 Days</div><div class="kpi-value danger" id="kpi-over60">--</div><div class="kpi-sub" id="kpi-o60-pct">-- of total</div></div>
      <div class="kpi-card"><div class="kpi-label">NWA Outstanding</div><div class="kpi-value" id="kpi-nwa">--</div><div class="kpi-sub" id="kpi-nwa-sub">--</div></div>
      <div class="kpi-card"><div class="kpi-label">LR Outstanding</div><div class="kpi-value" id="kpi-lr">--</div><div class="kpi-sub" id="kpi-lr-sub">--</div></div>
    </div>
    <div class="chart-card">
      <h3>Quarterly Trend - Outstanding Balance</h3>
      <canvas id="chart-trend" height="100"></canvas>
    </div>
    <div class="charts-grid">
      <div class="chart-card"><h3>By Doctor</h3><canvas id="chart-doctor" height="180"></canvas></div>
      <div class="chart-card"><h3>By Insurance</h3><canvas id="chart-ins" height="180"></canvas></div>
    </div>
    <div class="footer" id="footer-ts"></div>
  </main>
</div>

<script>
var TENANT_ID = '762dc822-17e2-44e0-8ef7-2ecedaf2671b';
var CLIENT_ID = '45b52ba5-6aa6-414e-9ccb-1500df096825';
var DRIVE_ID  = 'b!CyR2WhnJ-kO1B8Ia2yJRg6OwuZL8qqVPhMw7cnHHsltkAsRUmTFmQKMwa-erY5Qb';
var FILE_ID   = '01ODMVKL3HSHPGKO7V5VAK6MRK7A3AEMV7';
var charts = {};
var msalInstance;

try {
  msalInstance = new msal.PublicClientApplication({
    auth: {
      clientId: CLIENT_ID,
      authority: 'https://login.microsoftonline.com/' + TENANT_ID,
      redirectUri: window.location.origin + window.location.pathname
    },
    cache: { cacheLocation: 'sessionStorage', storeAuthStateInCookie: false }
  });
} catch(e) { console.error('MSAL init error:', e); }

var loginRequest = { scopes: ['Files.Read', 'User.Read'] };

function setStatus(msg, type) {
  var bar = document.getElementById('status-bar');
  bar.style.display = 'flex';
  bar.className = 'status-bar status-' + (type || 'loading');
  bar.innerHTML = (!type || type === 'loading') ? '<div class="spinner"></div> ' + msg : msg;
}
function clearStatus() { document.getElementById('status-bar').style.display = 'none'; }

function fmt(v) {
  if (v == null || isNaN(v)) return '--';
  return '$' + Number(v).toLocaleString('en-US', { maximumFractionDigits: 0 });
}
function pct(a, b) { return b ? Math.round((a / b) * 100) + '%' : '--'; }

function parseExcelDate(val) {
  if (!val) return null;
  if (typeof val === 'number') return new Date((val - 25569) * 86400 * 1000).getTime();
  var d = new Date(val);
  return isNaN(d) ? null : d.getTime();
}

function showApp() {
  var accounts = msalInstance.getAllAccounts();
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app-screen').style.display = 'block';
  if (accounts.length) document.getElementById('nav-email').textContent = accounts[0].username;
}

function signIn() {
  msalInstance.loginPopup(loginRequest).then(function() {
    showApp(); loadData();
  }).catch(function(e) { alert('Sign-in failed: ' + e.message); });
}

function signOut() { msalInstance.logoutPopup(); }

function getToken() {
  var accounts = msalInstance.getAllAccounts();
  if (!accounts.length) return Promise.reject(new Error('Not signed in'));
  return msalInstance.acquireTokenSilent({ scopes: loginRequest.scopes, account: accounts[0] })
    .then(function(r) { return r.accessToken; });
}

function readSheet(token, sheetName, range) {
  var url = 'https://graph.microsoft.com/v1.0/drives/' + DRIVE_ID +
    '/items/' + FILE_ID + '/workbook/worksheets/' +
    encodeURIComponent(sheetName) + '/range(address='' + range + '')';
  return fetch(url, { headers: { Authorization: 'Bearer ' + token } })
    .then(function(r) {
      if (!r.ok) throw new Error('Sheet ' + sheetName + ' error ' + r.status);
      return r.json();
    }).then(function(d) { return d.values || []; });
}

function loadData() {
  setStatus('Loading live data from OneDrive...');
  getToken().then(function(token) {
    return Promise.all([
      readSheet(token, 'NWA CLAIMS', 'A1:S1200'),
      readSheet(token, 'LR CLAIMS', 'A1:S700'),
      readSheet(token, 'Dashboard Feed', 'A1:H20')
    ]);
  }).then(function(res) {
    processData(res[0], res[1], res[2]);
    setStatus('Updated ' + new Date().toLocaleString(), 'ok');
    document.getElementById('footer-ts').textContent = 'Last refreshed: ' + new Date().toLocaleString();
    setTimeout(clearStatus, 4000);
  }).catch(function(e) {
    console.error(e);
    setStatus('Showing Sep 12 snapshot. Could not load live data: ' + e.message, 'error');
    loadFallback();
  });
}

function processData(nwaRows, lrRows, feedRows) {
  var h = nwaRows[0] || [];
  var ei = h.indexOf('EXP TO PAY'), fi = h.indexOf('FILE DATE');
  var di = h.indexOf('DOCTOR'), ii = h.indexOf('INSURANCE');
  var pi = h.indexOf('PAID'), li = h.indexOf('LOCATION');
  var now = Date.now();

  function toF(v) { return parseFloat(v) || 0; }
  function proc(rows, def) {
    return rows.slice(1).filter(function(r) { return toF(r[ei]) > 0 && !toF(r[pi]); })
      .map(function(r) {
        var fd = parseExcelDate(r[fi]);
        return { expToPay: toF(r[ei]), over60: fd ? (now-fd)/86400000 > 60 : false,
          doctor: String(r[di]||'').trim(), insurance: String(r[ii]||'').trim(),
          location: String(r[li]||def).trim() };
      });
  }

  var all = proc(nwaRows,'NWA').concat(proc(lrRows,'LR'));
  var nwa = all.filter(function(c){return c.location==='NWA';});
  var lr  = all.filter(function(c){return c.location==='LR';});
  function sum(a) { return a.reduce(function(s,c){return s+c.expToPay;},0); }
  function o60(a) { return a.filter(function(c){return c.over60;}).reduce(function(s,c){return s+c.expToPay;},0); }

  var total=sum(all), over60=o60(all), nwaT=sum(nwa), nwaO=o60(nwa), lrT=sum(lr), lrO=o60(lr);
  document.getElementById('kpi-total').textContent   = fmt(total);
  document.getElementById('kpi-over60').textContent  = fmt(over60);
  document.getElementById('kpi-o60-pct').textContent = pct(over60,total) + ' of total';
  document.getElementById('kpi-nwa').textContent     = fmt(nwaT);
  document.getElementById('kpi-nwa-sub').textContent = fmt(nwaO) + ' over 60 days';
  document.getElementById('kpi-lr').textContent      = fmt(lrT);
  document.getElementById('kpi-lr-sub').textContent  = fmt(lrO) + ' over 60 days';

  function groupBy(key) {
    var m = {};
    all.forEach(function(c) {
      var k = c[key]; if (!k) return;
      if (!m[k]) m[k]={t:0,o:0};
      m[k].t += c.expToPay;
      if (c.over60) m[k].o += c.expToPay;
    });
    return Object.entries(m).sort(function(a,b){return b[1].t-a[1].t;}).slice(0,10);
  }

  var docs = groupBy('doctor');
  renderBar('chart-doctor', docs.map(function(d){return d[0];}),
    docs.map(function(d){return d[1].t;}), docs.map(function(d){return d[1].o;}));

  var ins = groupBy('insurance');
  renderBar('chart-ins', ins.map(function(d){return d[0];}),
    ins.map(function(d){return d[1].t;}), ins.map(function(d){return d[1].o;}));

  if (feedRows && feedRows.length > 1) {
    var labels=[],nwaV=[],lrV=[],combV=[];
    feedRows.forEach(function(row) {
      var label = String(row[0]||'').trim();
      if (!label || label.toLowerCase().includes('quarter')) return;
      var n=parseFloat(row[1])||0, l=parseFloat(row[2])||0, c=parseFloat(row[3])||0;
      if (n+l+c===0) return;
      labels.push(label); nwaV.push(n); lrV.push(l); combV.push(c||n+l);
    });
    if (labels.length) { renderTrend(labels,nwaV,lrV,combV); return; }
  }
  loadFallbackTrend();
}

function renderTrend(labels, nwa, lr, combined) {
  if (charts.trend) charts.trend.destroy();
  charts.trend = new Chart(document.getElementById('chart-trend'), {
    type:'line', data:{ labels:labels, datasets:[
      {label:'Combined',data:combined,borderColor:'#1e3a5f',backgroundColor:'rgba(30,58,95,0.08)',borderWidth:2.5,tension:0.3,fill:true,pointRadius:4},
      {label:'NWA',data:nwa,borderColor:'#c8a96e',borderWidth:2,tension:0.3,pointRadius:3},
      {label:'LR',data:lr,borderColor:'#27ae60',borderWidth:2,tension:0.3,pointRadius:3}
    ]},
    options:{responsive:true,plugins:{legend:{position:'top'},tooltip:{callbacks:{label:function(c){return fmt(c.raw);}}}},
      scales:{y:{ticks:{callback:function(v){return '$'+(v/1000).toFixed(0)+'k';}},grid:{color:'#f0f0f0'}},x:{grid:{display:false}}}}
  });
}

function renderBar(id, labels, totals, over60) {
  if (charts[id]) charts[id].destroy();
  charts[id] = new Chart(document.getElementById(id), {
    type:'bar', data:{labels:labels,datasets:[
      {label:'Total',data:totals,backgroundColor:'#1e3a5f'},
      {label:'Over 60',data:over60,backgroundColor:'#c0392b'}
    ]},
    options:{indexAxis:'y',responsive:true,plugins:{legend:{position:'top'},tooltip:{callbacks:{label:function(c){return fmt(c.raw);}}}},
      scales:{x:{ticks:{callback:function(v){return '$'+(v/1000).toFixed(0)+'k';}},grid:{color:'#f0f0f0'}},y:{grid:{display:false}}}}
  });
}

function loadFallback() {
  document.getElementById('kpi-total').textContent   = '$2,404,636';
  document.getElementById('kpi-over60').textContent  = '$1,791,675';
  document.getElementById('kpi-o60-pct').textContent = '74.5% of total';
  document.getElementById('kpi-nwa').textContent     = '$1,514,028';
  document.getElementById('kpi-nwa-sub').textContent = '$1,218,317 over 60 days';
  document.getElementById('kpi-lr').textContent      = '$890,607';
  document.getElementById('kpi-lr-sub').textContent  = '$573,358 over 60 days';
  renderBar('chart-doctor',
    ['BULLOCH','VISHAJ','VAUGHAN','MCNEEL NWA','SALAZAR','SINADA','ANES LR','ANES NWA'],
    [1053119,509105,344201,227620,135339,69000,37301,28950],
    [833805,233991,306866,161623,135339,69000,32501,18550]);
  renderBar('chart-ins',
    ['BCBS Out of State','AMBETTER','ARBCBS','AETNA','TRICARE','WEBTPA','NATIONWIDE'],
    [1120100,839276,351018,63200,30000,940,101],
    [843600,772291,106544,38200,30000,940,101]);
  loadFallbackTrend();
  document.getElementById('footer-ts').textContent = 'Showing snapshot from Sep 12, 2026';
}

function loadFallbackTrend() {
  renderTrend(
    ['Q1 2025','Q2 2025','Q3 2025','Q4 2025','Q1 2026','Q2 2026','Q3 2026'],
    [1800000,1500000,1900000,2000000,1200000,1500000,1514028],
    [1097059,900871,1159051,1249416,708055,927065,890607],
    [2897059,2400871,3059051,3249416,1908055,2427065,2404636]
  );
}

window.addEventListener('load', function() {
  if (!msalInstance) { loadFallback(); return; }
  msalInstance.initialize().then(function() {
    return msalInstance.handleRedirectPromise();
  }).then(function() {
    var accounts = msalInstance.getAllAccounts();
    if (accounts.length) { showApp(); loadData(); }
  }).catch(function(e) { console.error(e); });
});
</script>
</body>
</html>
